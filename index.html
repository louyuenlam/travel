/* ---------------- files ---------------- */
let pendingFileTarget = null;
function pickFile(parentId, tripId) {
  if (!getSyncUrl() || !navigator.onLine) { toast(t('onlineOnly')); return; }
  pendingFileTarget = { parentId, tripId };
  const input = document.getElementById('file-input');
  if (input) { input.value = ''; input.click(); }
}
function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function onFilePicked(input) {
  const files = Array.from(input.files || []);
  if (!files.length || !pendingFileTarget) return;
  const target = pendingFileTarget;
  const ok = files.filter(f => f.size <= 10 * 1024 * 1024);
  if (ok.length < files.length) toast(t('fileTooBig'));
  let done = 0, failed = 0;
  for (const file of ok) {
    setSavingOverlay(true, ok.length > 1 ? t('uploadingN', done + 1, ok.length) : t('uploading'));
    const id = uid();
    try {
      const base64 = await readAsBase64(file);
      const data = await postRaw({ action: 'upload', item: { id, parent_id: target.parentId, trip_id: target.tripId, name: file.name, mime: file.type || 'application/octet-stream' }, data: base64 });
      applyServerData(data);
      await idbPut(id, { name: file.name, mime: file.type, blob: file });
      done++;
    } catch (e) { failed++; }
  }
  setSavingOverlay(false);
  toast(failed ? t('saveFail') : (done > 1 ? t('filesSaved', done) : t('fileSaved')));
  render();
}
async function openFile(id) {
  const meta = D().files.find(f => String(f.id) === String(id)) || {};
  let rec = await idbGet(id);
  if (!rec) {
    if (!getSyncUrl()) { toast(t('fileFail')); return; }
    setSavingOverlay(true, t('loadingFile'));
    try { rec = await fetchFileRec(id); }
    catch (e) { setSavingOverlay(false); toast(t('fileFail')); return; }
    setSavingOverlay(false);
  }
  const url = URL.createObjectURL(rec.blob);
  state.modal = { type: 'file', name: rec.name || meta.name, mime: rec.mime || meta.mime || '', url };
  render();
}
// Download a file from Drive (via Apps Script) and keep it in IndexedDB
async function fetchFileRec(id) {
  const sep = getSyncUrl().indexOf('?') >= 0 ? '&' : '?';
  const res = await fetch(getSyncUrl() + sep + 'action=file&id=' + encodeURIComponent(id), { redirect: 'follow' });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error);
  const bin = atob(data.data);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const rec = { name: data.name, mime: data.mime, blob: new Blob([bytes], { type: data.mime }) };
  await idbPut(id, rec);
  return rec;
}
function fileViewer(m) {
  const isImg = /^image\//.test(m.mime);
  const isPdf = /pdf/.test(m.mime);
  return `
    <h3 style="word-break:break-word">${esc(m.name)}</h3>
    <div class="file-viewer">
      ${isImg ? `<img src="${m.url}" alt="">` : isPdf ? `<iframe src="${m.url}"></iframe>` : ''}
    </div>
    <div class="type-hint" style="margin-top:8px">✓ ${esc(t('offlineSaved'))}</div>
    <div class="modal-actions">
      <a class="btn secondary" href="${m.url}" download="${esc(m.name)}" target="_blank" style="text-align:center;text-decoration:none">${esc(t('open'))}</a>
      <button class="btn primary" onclick="closeModal()">${esc(t('close'))}</button>
    </div>`;
}
async function deleteFile(id, btn) {
  if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = t('delConfirm'); return; }
  await send([{ action: 'delete', kind: 'files', id }]);
  await idbDel(id);
  toast(t('fileDeleted'));
  render();
}

/* ---------------- feedback ---------------- */
async function saving(fn) {
  state.saving = true;
  setSavingOverlay(true);
  try { await fn(); }
  catch (e) { console.error(e); toast(t('saveFail')); }
  finally { state.saving = false; setSavingOverlay(false); }
}
function setSavingOverlay(on, label) {
  let host = document.getElementById('saving-overlay');
  if (on) {
    if (!host) { host = document.createElement('div'); host.id = 'saving-overlay'; document.body.appendChild(host); }
    host.innerHTML = `<div class="saving-pill"><span class="spinner"></span>${esc(label || t('savingBtn'))}</div>`;
  } else if (host) host.remove();
}
function toast(msg) {
  let host = document.getElementById('toast-host');
  if (!host) { host = document.createElement('div'); host.id = 'toast-host'; document.body.appendChild(host); }
  host.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; host.appendChild(el);
  void el.offsetWidth;
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 350); }, 3000);
}

/* ---------------- language & start ---------------- */
function setLang(lang) {
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  state.lang = lang;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.body.classList.toggle('lang-zh', lang === 'zh');
  render();
}
function init() {
  let lang = 'en';
  try { const v = localStorage.getItem(LANG_KEY); if (v === 'zh' || v === 'en') lang = v; else if (/^zh/i.test(navigator.language || '')) lang = 'zh'; } catch {}
  state.lang = lang;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.body.classList.toggle('lang-zh', lang === 'zh');
  const cached = lsGet(LS.cache, null);
  if (cached) ['events', 'trips', 'packing', 'expenses', 'files'].forEach(k => { if (Array.isArray(cached[k])) state.data[k] = cached[k]; });
  state.route = parseRoute();
  setSync(getSyncUrl() ? 'syncing' : 'idle', getSyncUrl() ? t('syncing') : t('syncIdle'));
  render();
  idbLoadKeys().then(() => { if (state.route.tab === 'tickets') rerender(); });
  pull();
  state.pollTimer = setInterval(() => { if (!document.hidden) pull(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
}
init();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
