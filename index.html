<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel">
<meta name="theme-color" content="#CFE6F7">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon.png">
<title>Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Cream + dusty blue palette */
  --cream:        #f7f1e8;
  --cream-soft:   #fdf9f3;
  --cream-dark:   #ece4d4;
  --ink:          #2b3142;
  --ink-soft:     #4a5067;
  --muted:        #8a8a8a;
  --border:       #e6dfd0;

  --accent:       #a8b8d4;
  --accent-dark:  #5a7196;
  --accent-tint:  #e8eef7;

  --warn:         #c97a6b;
  --warn-tint:    #f5e3df;
  --sage:         #9eb89a;
  --sage-tint:    #e3ede1;

  /* Per-person colours (chips) */
  --p-jess:       #c97a6b;
  --p-jess-tint:  #f5e3df;
  --p-amus:       #2f6b4f;
  --p-amus-tint:  #dcebe2;
  --p-mum:        #b08bb5;
  --p-mum-tint:   #efe6f1;
  --p-house:      #7d8d6e;
  --p-house-tint: #e6ebde;

  --p-dad:        #6b8a8c;
  --p-dad-tint:   #dfe9ea;
  --p-anny:       #c2577f;
  --p-anny-tint:  #f6e1ea;
  --p-eliot:      #8b5e3c;
  --p-eliot-tint: #efe2d8;

  --p-milk:       #b89a7a;
  --p-milk-tint:  #f0e8dc;
  --p-bb:         #d49775;
  --p-bb-tint:    #f5e3d4;
  --p-cilla:      #c4a96a;
  --p-cilla-tint: #f1e8c9;

  --shadow:       0 1px 2px rgba(43, 49, 66, 0.04), 0 2px 8px rgba(43, 49, 66, 0.04);
  --shadow-lift:  0 2px 4px rgba(43, 49, 66, 0.06), 0 6px 18px rgba(43, 49, 66, 0.08);
  --radius:       16px;
  --radius-sm:    10px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  background: var(--cream);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Chinese mode: swap font stacks */
body.lang-zh {
  font-family: 'Noto Sans TC', 'Manrope', system-ui, sans-serif;
}
body.lang-zh .brand,
body.lang-zh .card h2,
body.lang-zh .modal h3,
body.lang-zh .day-editor .day-title,
body.lang-zh .bills-section-head,
body.lang-zh .cal-nav .month-label,
body.lang-zh .datestamp .day,
body.lang-zh .empty-state em,
body.lang-zh .amount {
  font-family: 'Noto Serif TC', 'Fraunces', serif;
}
body.lang-zh .brand em,
body.lang-zh .card h2 em,
body.lang-zh .modal h3 em,
body.lang-zh .cal-nav .month-label em,
body.lang-zh .empty-state em {
  /* Chinese has no italic — use weight + colour instead */
  font-style: normal;
  font-weight: 600;
}

/* Language toggle pill */
.lang-toggle {
  display: inline-flex;
  background: var(--cream-dark);
  border-radius: 999px;
  padding: 3px;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.lang-toggle button {
  padding: 4px 10px;
  border-radius: 999px;
  color: var(--muted);
  transition: all 0.2s;
  min-width: 28px;
}
.lang-toggle button.active {
  background: var(--cream-soft);
  color: var(--accent-dark);
  box-shadow: var(--shadow);
}

body::before, body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
body::before {
  background: radial-gradient(circle at 15% 10%, var(--accent-tint), transparent 55%);
  opacity: 0.6;
}
body::after {
  background: radial-gradient(circle at 85% 90%, var(--sage-tint), transparent 55%);
  opacity: 0.45;
}

input, textarea, select { -webkit-user-select: text; user-select: text; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: 16px; color: var(--ink); }

.app {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding:
    calc(env(safe-area-inset-top) + 18px)
    calc(env(safe-area-inset-right) + 18px)
    calc(env(safe-area-inset-bottom) + 32px)
    calc(env(safe-area-inset-left) + 18px);
}

/* ---------- Header ---------- */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 12px;
}
.brand {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.5px;
}
.brand em {
  font-style: italic;
  font-weight: 500;
  color: var(--accent-dark);
}
.datestamp {
  text-align: right;
  flex-shrink: 0;
}
.datestamp .month {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}
.datestamp .day {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 16px;
  color: var(--ink-soft);
  margin-top: 2px;
}

/* ---------- Sync status pill ---------- */
.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--cream-dark);
  color: var(--muted);
  margin-bottom: 14px;
}
.sync-pill .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
}
.sync-pill.ok { background: var(--sage-tint); color: var(--sage); }
.sync-pill.ok .dot { background: var(--sage); }
.sync-pill.syncing { background: var(--accent-tint); color: var(--accent-dark); }
.sync-pill.syncing .dot { background: var(--accent-dark); animation: pulse 1s infinite; }
.sync-pill.err { background: var(--warn-tint); color: var(--warn); }
.sync-pill.err .dot { background: var(--warn); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.sync-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 8px;
}
.sync-row .sync-pill {
  margin-bottom: 0;
}
.version-tag {
  font-size: 9px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.3px;
  font-variant-numeric: tabular-nums;
  opacity: 0.6;
  white-space: nowrap;
}

/* ---------- Tab bar ---------- */
.tabbar {
  display: flex;
  background: var(--cream-dark);
  border-radius: 12px;
  padding: 4px;
  gap: 2px;
  margin-bottom: 22px;
}
.tabbar button {
  flex: 1;
  padding: 10px 8px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  transition: all 0.2s;
}
.tabbar button.active {
  background: var(--cream-soft);
  color: var(--accent-dark);
  box-shadow: var(--shadow);
}
.tab-badge {
  display: inline-block;
  margin-left: 4px;
  background: var(--warn);
  color: white;
  font-size: 10px;
  font-weight: 700;
  min-width: 16px;
  height: 16px;
  line-height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  vertical-align: 1px;
}

/* ---------- View transitions ---------- */
.view {
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- Card ---------- */
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card h2 {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 4px;
}
.card h2 em {
  font-style: italic;
  font-weight: 500;
  color: var(--accent-dark);
}
.card .subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 16px;
}

/* ---------- Calendar ---------- */
.cal-toggle {
  display: flex;
  background: var(--cream-dark);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 14px;
  gap: 2px;
}
.cal-toggle button {
  flex: 1;
  padding: 8px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  transition: all 0.2s;
}
.cal-toggle button.active {
  background: var(--cream-soft);
  color: var(--accent-dark);
  box-shadow: var(--shadow);
}

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cal-nav .nav-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--cream-soft);
  border: 1px solid var(--border);
  font-size: 16px;
  color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center;
}
.cal-nav .nav-btn:active { background: var(--cream-dark); }
.cal-nav .month-label {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 600;
}
.cal-nav .month-label em {
  font-style: italic;
  font-weight: 500;
  color: var(--accent-dark);
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 6px;
}
.cal-weekdays div {
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 4px 0;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 8px;
  background: var(--cream-soft);
  border: 1px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 4px 2px;
  position: relative;
  font-size: 13px;
  color: var(--ink);
  transition: all 0.15s;
  overflow: hidden;
}
.cal-day.future { opacity: 0.7; }
.cal-day.other-month { opacity: 0.3; }
.cal-day.today {
  border: 2px solid var(--ink);
  font-weight: 700;
}
.cal-day.has-items {
  background: linear-gradient(135deg, var(--accent-tint), white);
}
.cal-day.selected {
  background: var(--accent-dark);
  color: white;
}
.cal-day:active { transform: scale(0.96); }

.cal-day .day-num { font-weight: 600; line-height: 1; }
.cal-day .dots {
  display: flex;
  gap: 2px;
  margin-top: 3px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 100%;
}
.cal-day .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent-dark);
}
/* !important: each dot carries its person colour inline, which would otherwise win */
.cal-day.selected .dot { background: white !important; }

/* Month navigation slide — subtle, direction matches the arrow tapped */
@keyframes calSlideFromRight {
  from { opacity: 0; transform: translateX(14px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes calSlideFromLeft {
  from { opacity: 0; transform: translateX(-14px); }
  to   { opacity: 1; transform: translateX(0); }
}
.cal-main.slide-in-right { animation: calSlideFromRight 0.22s ease-out; }
.cal-main.slide-in-left  { animation: calSlideFromLeft  0.22s ease-out; }

@media (prefers-reduced-motion: reduce) {
  .cal-main.slide-in-right,
  .cal-main.slide-in-left { animation: none; }
}

/* Inline event titles — hidden on phone, shown on tablets/desktop */
.cal-day .cal-items { display: none; }

/* ---------- Wide screens (iPad / desktop): two-pane layout ---------- */
@media (min-width: 820px) {
  .app { max-width: 1180px; }

  .cal-card { padding: 22px; }

  .cal-panes {
    display: grid;
    grid-template-columns: minmax(0, 1.85fr) minmax(300px, 1fr);
    gap: 24px;
    align-items: start;
  }
  .cal-side {
    position: sticky;
    top: 12px;
    border-left: 1px solid var(--border);
    padding-left: 22px;
    min-height: 200px;
  }
  .cal-side .day-editor { margin-top: 0; border-top: none; padding-top: 0; }

  /* Roomier day cells that fit text */
  .cal-grid { gap: 6px; }
  .cal-day {
    aspect-ratio: auto;
    min-height: 96px;
    align-items: stretch;
    justify-content: flex-start;
    padding: 6px 6px 4px;
    font-size: 14px;
  }
  .cal-day .day-num { text-align: left; font-size: 14px; }
  .cal-day .dots { display: none; }
  .cal-day .cal-items {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 5px;
    width: 100%;
    overflow: hidden;
  }
  .cal-day .cal-item {
    display: block;
    width: 100%;
    font-size: 11px;
    line-height: 1.3;
    text-align: left;
    padding: 2px 4px;
    border-radius: 3px;
    border-left: 3px solid var(--accent-dark);
    background: rgba(255,255,255,0.72);
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-day .cal-more {
    font-size: 10px;
    color: var(--muted);
    text-align: left;
    padding-left: 4px;
  }
  .cal-day.selected .cal-item {
    background: rgba(255,255,255,0.9);
  }
  .cal-day.selected .cal-more { color: rgba(255,255,255,0.85); }

  /* Forms and modals get more breathing room */
  .modal { max-width: 620px; }
}

/* ---------- Day editor ---------- */
.day-editor {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.day-editor .day-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 12px;
  color: var(--ink);
}
.day-editor .empty {
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  padding: 12px 0;
}

/* ---------- Item row (event/bill in the day editor or list) ---------- */
.item-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: white;
  margin-bottom: 8px;
}
.item-row.paid {
  background: linear-gradient(135deg, var(--sage-tint), white);
}
.item-row .item-main {
  flex: 1;
  min-width: 0;
}
.item-row .item-title {
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  word-break: break-word;
}
.item-row .item-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.item-row .item-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

/* ---------- Assignee chip ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.chip::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.chip.jess  { background: var(--p-jess-tint);  color: var(--p-jess); }
.chip.amus  { background: var(--p-amus-tint);  color: var(--p-amus); }
.chip.mum   { background: var(--p-mum-tint);   color: var(--p-mum); }
.chip.house { background: var(--p-house-tint); color: var(--p-house); }
.chip.dad   { background: var(--p-dad-tint);   color: var(--p-dad); }
.chip.anny  { background: var(--p-anny-tint);  color: var(--p-anny); }
.chip.eliot { background: var(--p-eliot-tint); color: var(--p-eliot); }
.chip.milk  { background: var(--p-milk-tint);  color: var(--p-milk); }
.chip.bb    { background: var(--p-bb-tint);    color: var(--p-bb); }
.chip.cilla { background: var(--p-cilla-tint); color: var(--p-cilla); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-height: 44px;
}
.btn.primary {
  background: var(--accent-dark);
  color: white;
}
.btn.primary:active { background: var(--ink); }
.btn.secondary {
  background: white;
  border: 1px solid var(--accent);
  color: var(--accent-dark);
}
.btn.secondary:active { background: var(--accent-tint); }
.btn.danger {
  background: white;
  border: 1px solid var(--warn);
  color: var(--warn);
}
.btn.danger:active { background: var(--warn-tint); }
.btn.full { width: 100%; }

.icon-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--cream-soft);
  border: 1px solid var(--border);
  font-size: 14px;
  color: var(--ink-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:active { background: var(--cream-dark); }
.icon-btn.warn { color: var(--warn); }

.add-btn {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-sm);
  border: 2px dashed var(--accent);
  background: transparent;
  color: var(--accent-dark);
  font-size: 14px;
  font-weight: 600;
  margin-top: 8px;
}
.add-btn:active { background: var(--accent-tint); }

/* ---------- Timezone picker ---------- */
.tz-button {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: white;
  font-size: 14px;
  text-align: left;
  min-height: 44px;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tz-button:active { background: var(--cream-soft); }
.tz-button .placeholder { color: var(--muted); }
.tz-list {
  max-height: 50vh;
  overflow-y: auto;
  margin-top: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: white;
  padding: 4px;
}
.tz-list .tz-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--ink);
  background: transparent;
}
.tz-list .tz-item:active,
.tz-list .tz-item.active { background: var(--accent-tint); color: var(--accent-dark); }
.tz-list .tz-section {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 6px 10px 4px;
}
.tz-list .tz-empty {
  padding: 10px;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}

/* ---------- Travel block ---------- */
.travel-block {
  background: var(--cream-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 12px;
}
.travel-block .block-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 14px;
  color: var(--accent-dark);
  margin-bottom: 8px;
}

.travel-row .item-meta svg {
  vertical-align: -2px;
  margin-right: 3px;
}

/* ---------- Modal ---------- */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(43, 49, 66, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
.modal {
  background: var(--cream-soft);
  border-radius: 18px;
  width: 100%;
  max-width: 380px;
  padding: 22px;
  animation: scaleIn 0.25s ease;
  max-height: 90vh;
  overflow-y: auto;
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
.modal h3 {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 600;
  margin: 0 0 16px;
}
.modal h3 em { font-style: italic; color: var(--accent-dark); font-weight: 500; }

/* View-only modal */
.modal h3.view-title {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-style: italic;
}
.modal h3.view-title svg {
  flex-shrink: 0;
}
.view-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
  padding: 14px;
  background: var(--cream-soft);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.view-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.view-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}
.view-value {
  font-size: 14px;
  color: var(--ink);
  word-break: break-word;
}
.view-value .chip {
  font-size: 11px;
  padding: 3px 9px;
}
.view-actions {
  gap: 8px;
}
.item-row {
  cursor: pointer;
}
.item-row:active .item-main {
  opacity: 0.7;
}

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="date"],
.field input[type="datetime-local"],
.field input[type="time"],
.field input[type="url"],
.field textarea,
.field select {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: white;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  min-height: 44px;
  transition: border-color 0.2s;
}
.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: var(--accent);
}
.field textarea { min-height: 70px; resize: vertical; }
.field .chip-picker {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.field .chip-picker button {
  padding: 7px 14px;
  border-radius: 999px;
  background: white;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
}
.field .chip-picker button.active {
  background: var(--accent-dark);
  border-color: var(--accent-dark);
  color: white;
}
.field .checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.field .checkbox-row input[type="checkbox"] {
  width: 20px; height: 20px;
  -webkit-appearance: auto; appearance: auto;
}
.field .checkbox-row span { font-size: 14px; }

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}
.modal-actions .btn { flex: 1; }

/* ---------- Settings sections ---------- */
.section-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 22px 0 8px;
  padding-left: 4px;
}

.field .help {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
  line-height: 1.4;
}
.field .help code {
  background: var(--cream-dark);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 10px;
}

.danger-card {
  border-color: var(--warn);
  background: linear-gradient(135deg, var(--warn-tint), white);
}

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 92px);
  left: 50%;
  transform: translateX(-50%) translateY(60px) scale(0.92);
  background: var(--ink);
  color: var(--cream);
  padding: 14px 26px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  z-index: 200;
  transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
  pointer-events: none;
  opacity: 0;
  white-space: nowrap;
  max-width: 90vw;
}
.toast.show {
  transform: translateX(-50%) translateY(0) scale(1);
  opacity: 1;
}
.toast.error {
  background: var(--warn);
}

/* ---------- Saving overlay ---------- */
#saving-overlay {
  position: fixed;
  inset: 0;
  background: rgba(43, 49, 66, 0.35);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
}
#saving-overlay .saving-pill {
  background: var(--ink);
  color: var(--cream);
  padding: 16px 30px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
#saving-overlay .spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Bills list ---------- */
.bills-section-head {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 500;
  font-style: italic;
  color: var(--ink-soft);
  margin: 14px 0 8px;
}
.empty-state {
  text-align: center;
  padding: 30px 18px;
  color: var(--muted);
  font-size: 14px;
}
.empty-state em {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 500;
  color: var(--accent-dark);
}

.amount {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  white-space: nowrap;
}
.amount.paid { color: var(--sage); text-decoration: line-through; opacity: 0.7; }

/* ---------- Backup banner ---------- */
.backup-banner {
  background: linear-gradient(135deg, var(--warn-tint), white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
}
.backup-banner button {
  font-weight: 600;
  color: var(--accent-dark);
}
.backup-banner .dismiss {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  font-size: 16px;
}

/* ================= Travel app additions ================= */
.app-switch {
  display: inline-flex; align-items: center; gap: 6px;
  margin-left: 8px; padding: 6px 12px; border-radius: 999px;
  background: var(--cream-dark); color: var(--accent-dark);
  font-size: 12px; font-weight: 600; text-decoration: none; vertical-align: middle;
}
.brand-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.brand-row .lang-toggle { margin-top: 0; }

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: none; padding: 4px 0 12px;
  color: var(--accent-dark); font-size: 14px; font-weight: 600; cursor: pointer;
}

/* Trip cards on the home screen */
.trip-card {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: linear-gradient(135deg, var(--accent-tint), white);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  font: inherit; color: var(--ink);
}
.trip-card.past { background: white; opacity: 0.75; }
.trip-card .tc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.trip-card .tc-name { font-family: 'Fraunces', 'Noto Serif TC', serif; font-size: 20px; font-weight: 600; line-height: 1.2; }
.trip-card .tc-count { font-size: 12px; font-weight: 700; color: var(--accent-dark); white-space: nowrap; }
.trip-card .tc-sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
.trip-card .tc-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.stat-pill {
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: rgba(255,255,255,0.8); border: 1px solid var(--border); color: var(--ink-soft);
}

/* Trip header */
.trip-head h2 {
  font-family: 'Fraunces', 'Noto Serif TC', serif; font-size: 26px; font-weight: 600;
  line-height: 1.15; margin: 0 0 6px;
}
.trip-head .th-sub { color: var(--ink-soft); font-size: 14px; }
.trip-head .th-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.trip-head .th-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* Itinerary */
.day-block { margin-bottom: 18px; }
.day-head {
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px;
}
.day-head .dh-date { font-family: 'Fraunces', 'Noto Serif TC', serif; font-style: italic; font-size: 18px; font-weight: 500; }
.day-head .dh-num { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.trip-row {
  display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
  background: white; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 11px 12px; margin-bottom: 8px; cursor: pointer; font: inherit; color: var(--ink);
}
.trip-row:active { background: var(--cream-soft); }
.trip-row.soft { background: var(--cream-soft); }
.trip-ico {
  flex: 0 0 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  background: var(--accent-tint); color: var(--accent-dark);
}
.trip-ico.stay { background: var(--sage-tint); color: #5d7a58; }
.trip-ico.activity { background: var(--warn-tint); color: var(--warn); }
.trip-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.trip-time { font-size: 12px; font-weight: 700; color: var(--accent-dark); font-variant-numeric: tabular-nums; }
.trip-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
.trip-sub { font-size: 12px; color: var(--ink-soft); line-height: 1.4; word-break: break-word; }
.ref-pill {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
  padding: 2px 8px; border-radius: 6px; background: var(--cream-dark); color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.mini-add {
  width: 100%; padding: 8px; border-radius: var(--radius-sm); border: 1px dashed var(--accent);
  background: transparent; color: var(--accent-dark); font-size: 13px; font-weight: 600; cursor: pointer;
}

/* Tickets */
.ticket-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; background: white; }
.ticket-card .tk-head { display: flex; gap: 10px; align-items: flex-start; }
.ticket-card .tk-ref { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.ticket-card .tk-ref .ref-big { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
.file-row {
  display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px;
  border-radius: 8px; background: var(--cream-soft); border: 1px solid var(--border);
}
.file-row .fr-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; color: var(--accent-dark); }
.file-row .fr-size { font-size: 11px; color: var(--muted); }
.small-btn {
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: white;
  font-size: 12px; font-weight: 600; color: var(--accent-dark); cursor: pointer;
}
.small-btn.warn { color: var(--warn); }
.file-viewer img { max-width: 100%; border-radius: 8px; display: block; margin: 0 auto; }
.file-viewer iframe { width: 100%; height: 60vh; border: 1px solid var(--border); border-radius: 8px; background: white; }

/* Packing */
.progress { height: 8px; border-radius: 999px; background: var(--cream-dark); overflow: hidden; margin: 6px 0 4px; }
.progress > div { height: 100%; background: var(--sage); border-radius: 999px; transition: width 0.3s; }
.pack-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 4px;
  border-bottom: 1px solid var(--border);
}
.pack-row:last-child { border-bottom: none; }
.pack-check {
  flex: 0 0 24px; height: 24px; border-radius: 7px; border: 2px solid var(--accent);
  background: white; display: flex; align-items: center; justify-content: center;
  color: white; font-size: 14px; font-weight: 700; cursor: pointer; padding: 0;
}
.pack-check.on { background: var(--sage); border-color: var(--sage); }
.pack-name { flex: 1; font-size: 15px; cursor: pointer; }
.pack-row.done .pack-name { text-decoration: line-through; color: var(--muted); }
.pack-x { background: none; border: none; color: var(--muted); font-size: 16px; padding: 4px 6px; cursor: pointer; }
.pack-add { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; }
.pack-add .row2 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.pack-add select, .pack-add input {
  width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: white; min-height: 44px; box-sizing: border-box; -webkit-appearance: none;
}
.who-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--cream-dark); color: var(--ink-soft); }

/* Budget */
.money-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.money-tile { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; background: var(--cream-soft); }
.money-tile .mt-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.money-tile .mt-value { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.money-tile .mt-sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
.settle { margin-top: 12px; padding: 12px; border-radius: var(--radius-sm); background: var(--sage-tint); font-size: 14px; line-height: 1.6; }
.exp-amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

.field-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.field-row .field { min-width: 0; }
.field-row input, .field-row select { min-width: 0; max-width: 100%; }
.field select {
  width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: white; min-height: 44px; box-sizing: border-box; font-size: 16px;
}
.type-hint { font-size: 12px; color: var(--muted); margin-top: -4px; margin-bottom: 10px; }
.delete-link {
  display: block; width: 100%; margin-top: 14px; padding: 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--warn); background: white; color: var(--warn); font-weight: 600; font-size: 14px; cursor: pointer;
}
.delete-link.armed { background: var(--warn); color: white; }
.tabbar.four button { font-size: 13px; padding-left: 4px; padding-right: 4px; }
.tabbar.five button { font-size: 12px; padding-left: 2px; padding-right: 2px; }

/* Map */
.map-box { position: relative; isolation: isolate; height: 52vh; min-height: 300px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); background: var(--cream-dark); }
.map-inner { position: absolute; inset: 0; }
.map-msg { padding: 40px 18px; text-align: center; color: var(--muted); font-size: 14px; }
.map-actions { display: flex; gap: 8px; margin-top: 12px; }
.map-actions .btn { flex: 1; }
.map-cross { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 900; pointer-events: none; display: none; }
.map-cross::before, .map-cross::after { content: ''; position: absolute; background: var(--warn); }
.map-cross::before { left: 12px; top: 0; width: 2px; height: 26px; }
.map-cross::after { top: 12px; left: 0; height: 2px; width: 26px; }
.map-box.picking .map-cross { display: block; }
.route-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--cream-soft); border: 1px solid var(--border); }
.route-row.off { opacity: 0.5; }
.route-row .rr-swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; cursor: pointer; }
.route-row .rr-main { flex: 1; min-width: 0; cursor: pointer; }
.route-row .rr-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route-row .rr-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.ci-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: white; border: 1px solid var(--border); }
.ci-num { width: 24px; height: 24px; border-radius: 50%; background: var(--warn); color: white; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.ci-main { flex: 1; min-width: 0; cursor: pointer; }
.ci-note { font-size: 13px; font-weight: 600; word-break: break-word; }
.ci-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
.ci-pin { background: none; border: none; }
.ci-pin span { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--warn); border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.ci-pin span b { transform: rotate(45deg); color: white; font-size: 11px; }
.leaflet-popup-content { font-family: inherit; font-size: 13px; }

@media (min-width: 820px) {
  .trip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
}

/* =========================================================
   v3 · 2026-11-26 — Boarding-pass theme (baby blue + navy)
   ========================================================= */
:root {
  --sky: #CFE6F7;
  --navy: #1F3A68;
  --navy-ink: #13233B;
  --pass: #FFF4E0;
  --pass-line: #D9C9A8;
  --blue-mid: #3D6FB0;
  --coral: #E2725B;
  --mustard: #E0A526;
  --cream: var(--sky);
  --cream-soft: #FFF9EE;
  --cream-dark: #E8DCC2;
  --ink: var(--navy-ink);
  --ink-soft: #33466A;
  --muted: #5E6B85;
  --border: #E3D6BB;
  --accent: var(--blue-mid);
  --accent-dark: var(--navy);
  --accent-tint: #E3EEF9;
  --warn: #C4513A;
  --warn-tint: #F8DDD5;
  --radius: 18px;
}
body { background: var(--sky); }
body::before, body::after { display: none; }
.mono { font-family: 'Space Mono', ui-monospace, monospace; }
.bebas { font-family: 'Bebas Neue', 'Noto Sans TC', sans-serif; letter-spacing: 0.5px; }

/* Header */
.brand { font-family: 'Bebas Neue', 'Noto Sans TC', sans-serif; font-size: 44px; font-weight: 400; letter-spacing: 1px; color: var(--navy-ink); }
.brand em { font-style: normal; font-weight: 400; color: var(--coral); }
body.lang-zh .brand { font-family: 'Noto Sans TC', sans-serif; font-weight: 900; font-size: 34px; letter-spacing: 0; }
body.lang-zh .brand em { font-weight: 900; }
.lang-toggle { background: white; border: 2px solid var(--navy-ink); }
.lang-toggle button { color: var(--navy-ink); }
.lang-toggle button.active { background: var(--navy); color: var(--pass); box-shadow: none; }
.sync-pill { background: white; color: var(--navy-ink); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; }
.sync-pill.ok { background: white; color: var(--navy-ink); }
.sync-pill.ok .dot { background: #2F8F5B; }
.version-tag { color: var(--navy-ink); opacity: 0.7; font-family: 'Space Mono', monospace; }
.back-link { color: var(--navy-ink); font-weight: 700; }
.section-title { color: var(--navy-ink); font-family: 'Space Mono', monospace; font-weight: 700; letter-spacing: 2px; }

/* Cards = ticket paper */
.card { background: var(--pass); border: none; box-shadow: 0 2px 0 rgba(19,35,59,.08); }
.card h2 { font-family: 'Bebas Neue', 'Noto Sans TC', sans-serif; font-weight: 400; letter-spacing: .5px; }
.modal { background: var(--pass); }
.modal h3 { color: var(--navy-ink); }
.empty-state { color: var(--muted); }
.type-hint { color: var(--muted); }

/* Buttons */
.btn.primary { background: var(--navy); color: var(--pass); }
.btn.primary:active { background: var(--navy-ink); }
.btn.secondary { background: white; border: 2px solid var(--navy-ink); color: var(--navy-ink); }
.add-btn { background: white; border: 2px dashed var(--navy-ink); color: var(--navy-ink); font-weight: 700; border-radius: 14px; }
.mini-add { background: white; border: 2px dashed var(--navy-ink); color: var(--navy-ink); border-radius: 12px; min-height: 44px; }
.icon-btn { background: white; border: 2px solid var(--navy-ink); color: var(--navy-ink); }

.pass-to { font-family: 'Space Mono', monospace; font-size: 11px; }

.pass-tear { border-top: 2px dashed var(--pass-line); margin: 0 14px; }
.pass-foot { padding: 12px 16px 14px; display: flex; align-items: center; gap: 14px; }

/* ---------------- helpers ---------------- */
function t(key, ...args) {
  const v = (I18N[state.lang] || I18N.en)[key];
  const val = v === undefined ? I18N.en[key] : v;
  return typeof val === 'function' ? val(...args) : (val === undefined ? key : val);
}
function lsGet(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
}
function pad(n) { return String(n).padStart(2, '0'); }
function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() { return dkey(new Date()); }
function parseKey(k) { const p = String(k).split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); }
function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); }
function daysBetween(a, b) {
  const pa = String(a).split('-').map(Number), pb = String(b).split('-').map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
}
function locale() { return state.lang === 'zh' ? 'zh-HK' : 'en-GB'; }
function fmtDay(k, withWeekday) {
  if (!k) return '';
  return parseKey(k).toLocaleDateString(locale(), withWeekday === false
    ? { day: 'numeric', month: 'short' } : { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtRange(a, b) {
  if (!a) return '';
  if (!b || a === b) return fmtDay(a) + ', ' + parseKey(a).getFullYear();
  const ya = parseKey(a).getFullYear(), yb = parseKey(b).getFullYear();
  return fmtDay(a) + ' – ' + fmtDay(b) + ', ' + yb + (ya !== yb ? ' (' + ya + ')' : '');
}
function hhmm(v) {
  if (v == null || v === '') return '';
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2}):(\d{2})/); if (m) return pad(m[1]) + ':' + m[2];
  m = s.match(/T(\d{2}):(\d{2})/); if (m) return m[1] + ':' + m[2];
  return '';
}
function list(v) {
  if (v == null || v === '') return [];
  if (Array.isArray(v)) return v.filter(Boolean);
  return String(v).split(',').map(s => s.trim()).filter(Boolean);
}
function truthy(v) { return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1'; }
function personName(id) { const p = PEOPLE.find(x => x.id === id); return p ? p[state.lang] || p.en : id; }
function chipFor(id) { return `<span class="chip ${esc(id)}">${esc(personName(id))}</span>`; }
function money(amount, cur) {
  const n = Number(amount) || 0;
  const s = n.toLocaleString(locale(), { minimumFractionDigits: cur === 'JPY' ? 0 : 2, maximumFractionDigits: cur === 'JPY' ? 0 : 2 });
  return (CUR_SYMBOL[cur] || (cur + ' ')) + s;
}
function parseAlarms(raw) {
  if (raw === null || raw === undefined || raw === '') return [];
  return String(raw).split(/[|,;\s]+/).filter(s => s !== '' && !isNaN(Number(s))).map(Number);
}
function serialiseAlarms(arr) {
  const u = Array.from(new Set((arr || []).map(Number).filter(n => !isNaN(n)))); u.sort((a, b) => b - a); return u.join('|');
}

function tzLabel(tz) { const parts = String(tz).split('/'); return (parts[parts.length - 1] || tz).replace(/_/g, ' '); }

/* ---------------- data access ---------------- */
function D() { return state.data; }
function tripById(id) { return D().trips.find(x => String(x.id) === String(id)); }
function itemType(e) {
  if (e.kind === 'travel') return 'transport';
  if (e.kind === 'stay') return 'stay';
  if (e.kind === 'activity') return 'activity';
  if (/^(hotel|酒店|住宿)\b|^hotel:/i.test(String(e.title || ''))) return 'stay';
  return 'activity';
}
function lastNight(e) { return (e.end_date && e.end_date > e.date) ? e.end_date : e.date; }
function tripItems(trip) {
  if (!trip) return [];
  const trav = list(trip.travellers).length ? list(trip.travellers) : DEFAULT_TRAVELLERS;
  return D().events.filter(e => {
    if (!e.date) return false;
    if (e.recurring && e.recurring !== 'none') return false;
    const type = itemType(e);
    const last = type === 'stay' ? addDays(lastNight(e), 1) : (e.end_date && e.end_date > e.date ? e.end_date : e.date);
    if (e.date > trip.end_date || last < trip.start_date) return false;
    return list(e.assignee).some(p => trav.indexOf(p) >= 0);
  });
}
function itemsSorted(items) {
  return items.slice().sort((a, b) => (a.date + (hhmm(a.time) || '99')).localeCompare(b.date + (hhmm(b.time) || '99')));
}
function filesFor(parentId) { return D().files.filter(f => String(f.parent_id) === String(parentId)); }
function splitNotes(notes) {
  const lines = String(notes || '').split('\n');
  if (lines[0] && lines[0].trim().startsWith('@')) {
    return { location: lines[0].trim().slice(1).trim(), rest: lines.slice(1).join('\n').trim() };
  }
  return { location: '', rest: String(notes || '').trim() };
}
function joinNotes(location, rest) {
  const loc = String(location || '').trim();
  return (loc ? '@' + loc + (rest ? '\n' : '') : '') + String(rest || '').trim();
}

/* ---------------- sync ---------------- */
function getSyncUrl() { return lsGet(LS.syncUrl, '') || DEFAULT_SYNC_URL; }
function setSync(status, msg) { state.sync = { status, msg }; renderSyncPill(); }
function applyServerData(data) {
  ['events', 'trips', 'packing', 'expenses', 'files'].forEach(k => { if (Array.isArray(data[k])) state.data[k] = data[k]; });
  lsSet(LS.cache, state.data);
}
async function pull() {
  const url = getSyncUrl();
  if (!url) { setSync('idle', t('syncIdle')); return; }
  setSync('syncing', t('syncing'));
  try {
    await flushPending();
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Server error');
    applyServerData(data);
    setSync('ok', t('synced'));
    rerender();
  } catch (e) {
    setSync('err', t('offline'));
  }
}
async function postRaw(body) {
  const res = await fetch(getSyncUrl(), {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Server error');
  return data;
}
async function flushPending() {
  const q = lsGet(LS.pending, []);
  if (!q.length || !getSyncUrl()) return;
  const left = [];
  for (const body of q) {
    try { await postRaw(body); } catch (e) { left.push(body); }
  }
  lsSet(LS.pending, left);
}
// Apply a change on the phone straight away, then send it. Returns true when the server confirmed it.
function applyLocal(change) {
  const arr = state.data[change.kind];
  if (!arr) return;
  if (change.action === 'add') arr.push(change.item);
  if (change.action === 'update') { const i = arr.findIndex(x => String(x.id) === String(change.item.id)); if (i >= 0) arr[i] = change.item; else arr.push(change.item); }
  if (change.action === 'delete') { state.data[change.kind] = arr.filter(x => String(x.id) !== String(change.id)); }
}
async function send(changes) {
  changes.forEach(applyLocal);
  lsSet(LS.cache, state.data);
  const body = changes.length === 1 ? changes[0] : { action: 'bulk', changes };
  if (!getSyncUrl()) { lsSet(LS.pending, lsGet(LS.pending, []).concat([body])); setSync('err', t('queued')); return false; }
  setSync('syncing', t('saving'));
  try {
    const data = await postRaw(body);
    await flushPending();
    applyServerData(data);
    setSync('ok', t('synced'));
    return true;
  } catch (e) {
    lsSet(LS.pending, lsGet(LS.pending, []).concat([body]));
    setSync('err', t('queued'));
    return false;
  }
}

/* ---------------- offline file cache (IndexedDB) ---------------- */
function idb() {
  return new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open('familyTripsFiles', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('files');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  });
}
async function idbGet(id) {
  try { const db = await idb(); return await new Promise(r => { const q = db.transaction('files').objectStore('files').get(id); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); }
  catch { return null; }
}
const cachedIds = new Set();
async function idbLoadKeys() {
  try { const db = await idb(); const keys = await new Promise(r => { const q = db.transaction('files').objectStore('files').getAllKeys(); q.onsuccess = () => r(q.result || []); q.onerror = () => r([]); }); keys.forEach(k => cachedIds.add(String(k))); }
  catch {}
}
async function idbPut(id, val) {
  cachedIds.add(String(id));
  try { const db = await idb(); await new Promise(r => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(val, id); tx.oncomplete = r; tx.onerror = r; }); }
  catch {}
}
async function idbDel(id) {
  cachedIds.delete(String(id));
  try { const db = await idb(); await new Promise(r => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(id); tx.oncomplete = r; tx.onerror = r; }); }
  catch {}
}

function renderTrip(trip, tab) {

/* ---- Itinerary ---- */
function itemRowParts(e) {
  const type = itemType(e);
  const sn = splitNotes(e.notes);
  let time = '', sub = [];
  if (type === 'transport') {
    const a = hhmm(e.time), b = hhmm(e.end_time);
    const arrDay = e.end_date && e.end_date !== e.date ? ' (' + fmtDay(e.end_date, false) + ')' : '';
    time = a && b ? `${a} → ${b}${arrDay}` : (a || '');
    if (e.from_location || e.to_location) sub.push([e.from_location, e.to_location].filter(Boolean).join(' → '));
  } else {
    const a = hhmm(e.time), b = hhmm(e.end_time);
    time = a && b ? `${a} → ${b}` : a;
    if (sn.location) sub.push(sn.location);
  }
  return { type, time, sub };
}
function renderItemRow(e, label, soft) {
  const p = itemRowParts(e);
  const files = filesFor(e.id).length;
  const ref = e.booking_ref ? `<span class="ref-pill">${esc(e.booking_ref)}</span>` : '';
  const timeLine = [label, p.time].filter(Boolean).join(' · ');
  return `
    <button class="trip-row ${soft ? 'soft' : ''}" onclick="openItemModal('${esc(e.id)}')">
      <span class="trip-ico ${p.type}">${itemIcon(p.type, e.travel_method)}</span>
      <span class="trip-main">
        ${timeLine ? `<span class="trip-time">${esc(timeLine)}</span>` : ''}
        <span class="trip-title">${esc(e.title || t('untitled'))}</span>
        ${p.sub.length || ref || files ? `<span class="trip-sub">${esc(p.sub.join(' · '))} ${ref} ${files ? '📎' + files : ''}</span>` : ''}
      </span>
    </button>`;
}
function renderItinerary(trip) {
  const items = itemsSorted(tripItems(trip));
  const days = [];
  for (let k = trip.start_date, i = 1; k <= trip.end_date && i <= 60; k = addDays(k, 1), i++) days.push(k);
  const blocks = days.map((k, i) => {
    const rows = [];
    items.forEach(e => {
      const type = itemType(e);
      if (type === 'stay') {
        const ln = lastNight(e);
        if (k === e.date) rows.push({ order: 9, html: renderItemRow(e, t('checkin'), false) });
        else if (k > e.date && k <= ln) rows.push({ order: 9, html: renderItemRow(e, t('staying'), true) });
        else if (k === addDays(ln, 1)) rows.push({ order: 0, html: renderItemRow(e, t('checkout'), true) });
      } else if (type === 'transport') {
        if (e.date === k) rows.push({ order: 1, time: hhmm(e.time) || '99', html: renderItemRow(e, '', false) });
      } else {
        const last = e.end_date && e.end_date > e.date ? e.end_date : e.date;
        if (k >= e.date && k <= last) rows.push({ order: 1, time: hhmm(e.time) || '98', html: renderItemRow(e, '', false) });
      }
    });
    rows.sort((a, b) => a.order - b.order || String(a.time || '').localeCompare(String(b.time || '')));
    return `
      <div class="day-block">
        <div class="day-head"><span class="dh-num">DAY ${pad(i + 1)}</span><span class="dh-date">${esc(fmtDay(k))}</span></div>
        ${rows.length ? rows.map(r => r.html).join('') : `<div class="type-hint" style="margin:0 0 8px 4px">${esc(t('nothingDay'))}</div>`}
        <button class="mini-add" onclick="openItemModal(null, '${k}')">${esc(t('addHere'))}</button>
      </div>`;
  }).join('');
  return `<div class="card">${blocks}</div>`;
}

async function togglePacked(id) {

async function addPack(tripId) {

async function addStarterPack(tripId) {

/* ---- Budget ---- */
function renderBudget(trip) {
  const ex = D().expenses.filter(x => String(x.trip_id) === String(trip.id))
    .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.created_at).localeCompare(String(b.created_at)));
  const trav = list(trip.travellers);
  const byCur = {};
  ex.forEach(x => {
    const cur = x.currency || 'GBP';
    const amt = Number(x.amount) || 0;
    const split = list(x.split_with).length ? list(x.split_with) : trav;
    const b = byCur[cur] = byCur[cur] || { total: 0, paid: {}, share: {} };
    b.total += amt;
    b.paid[x.paid_by] = (b.paid[x.paid_by] || 0) + amt;
    split.forEach(p => { b.share[p] = (b.share[p] || 0) + amt / split.length; });
  });
  const tiles = Object.keys(byCur).map(cur => {
    const b = byCur[cur];
    const people = Array.from(new Set(Object.keys(b.paid).concat(Object.keys(b.share)))).filter(Boolean);
    return `
      <div class="money-tile">
        <div class="mt-label">${esc(t('total'))} · ${esc(cur)}</div>
        <div class="mt-value">${esc(money(b.total, cur))}</div>
        <div class="mt-sub">${people.map(p => esc(t('paid', personName(p), money(b.paid[p] || 0, cur))) + ' · ' + esc(t('share', money(b.share[p] || 0, cur)))).join('<br>')}</div>
      </div>`;
  }).join('');
  // Settle up, per currency
  const settle = [];
  Object.keys(byCur).forEach(cur => {
    const b = byCur[cur];
    const bal = {};
    Object.keys(b.paid).forEach(p => { bal[p] = (bal[p] || 0) + b.paid[p]; });
    Object.keys(b.share).forEach(p => { bal[p] = (bal[p] || 0) - b.share[p]; });
    const debtors = Object.keys(bal).filter(p => bal[p] < -0.005).map(p => ({ p, v: -bal[p] }));
    const creditors = Object.keys(bal).filter(p => bal[p] > 0.005).map(p => ({ p, v: bal[p] }));
    debtors.forEach(d => {
      creditors.forEach(c => {
        if (d.v < 0.005 || c.v < 0.005) return;
        const x = Math.min(d.v, c.v);
        settle.push(t('owes', personName(d.p), personName(c.p), money(x, cur)));
        d.v -= x; c.v -= x;
      });
    });
  });
  const rows = ex.map(x => `
    <button class="trip-row" onclick="openExpenseModal('${esc(trip.id)}', '${esc(x.id)}')">
      <span class="trip-main">
        <span class="trip-time">${esc(fmtDay(x.date))} · ${esc(t('e_' + (x.category || 'other')))}</span>
        <span class="trip-title">${esc(x.title || t('untitled'))}</span>
        <span class="trip-sub">${esc(t('paidBy'))}: ${esc(personName(x.paid_by))} · ${esc(t('splitWith'))}: ${esc((list(x.split_with).length ? list(x.split_with) : trav).map(personName).join(', '))}</span>
      </span>
      <span class="exp-amount">${esc(money(x.amount, x.currency || 'GBP'))}</span>
    </button>`).join('');
  return `
    <div class="card">
      <div class="day-head"><span class="dh-date">${esc(t('budgetTitle'))}</span></div>
      ${tiles ? `<div class="money-grid">${tiles}</div><div class="settle">${settle.length ? settle.map(esc).join('<br>') : esc(t('allSquare'))}</div>` : ''}
      <div style="margin-top:14px">${rows || `<div class="empty-state">${esc(t('noExp'))}</div>`}</div>
      <button class="add-btn" onclick="openExpenseModal('${esc(trip.id)}')">${esc(t('addExpense'))}</button>
    </div>`;
}

/* ---- Map (GPX routes + check-ins) ----
   Stored in the Files sheet so no Apps Script change is needed:
   - GPX route: an uploaded file with parent_id 'gpx'
   - Check-in:  a Files row with parent_id 'checkin', mime 'application/x-checkin',
                name = JSON {lat, lng, acc, note, at}  (no Drive file) */
const GPX_PARENT = 'gpx';
const CHECKIN_PARENT = 'checkin';
const CHECKIN_MIME = 'application/x-checkin';
const ROUTE_COLOURS = ['#5a7196', '#c0694e', '#5f8f62', '#8e6bb0', '#c99a2e', '#3f8f9a'];
const LEAFLET_VER = '1.9.4';
const mapState = { el: null, map: null, layers: null, tripId: null, sig: '', gpx: {}, failed: {}, loading: {}, hidden: new Set(), picking: false };

function isMapFile(f) { const p = String(f.parent_id); return p === GPX_PARENT || p === CHECKIN_PARENT; }
function gpxFiles(trip) {
  return D().files.filter(f => String(f.trip_id) === String(trip.id) && String(f.parent_id) === GPX_PARENT)
    .sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
}
function parseCheckin(f) {
  try {
    const o = JSON.parse(f.name);
    const lat = Number(o.lat), lng = Number(o.lng);
    if (!isFinite(lat) || !isFinite(lng)) return null;
    return { id: f.id, lat, lng, acc: o.acc, note: o.note || '', at: o.at || f.created_at || '', raw: f };
  } catch { return null; }
}
function tripCheckins(trip) {
  return D().files.filter(f => String(f.trip_id) === String(trip.id) && String(f.parent_id) === CHECKIN_PARENT)
    .map(parseCheckin).filter(Boolean)
    .sort((a, b) => String(a.at).localeCompare(String(b.at)));
}
function routeColour(trip, id) { const i = gpxFiles(trip).findIndex(f => String(f.id) === String(id)); return ROUTE_COLOURS[Math.max(0, i) % ROUTE_COLOURS.length]; }

/* GPX parsing */
function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('bad xml');
  const root = doc.documentElement;
  if (!root || root.localName !== 'gpx') throw new Error('not gpx');
  const pt = el => {
    const lat = parseFloat(el.getAttribute('lat')), lng = parseFloat(el.getAttribute('lon'));
    const tEl = el.getElementsByTagNameNS('*', 'time')[0];
    const time = tEl ? Date.parse(tEl.textContent) : NaN;
    return { lat, lng, time };
  };
  const ok = p => isFinite(p.lat) && isFinite(p.lng);
  let segs = Array.from(doc.getElementsByTagNameNS('*', 'trkseg'))
    .map(s => Array.from(s.getElementsByTagNameNS('*', 'trkpt')).map(pt).filter(ok)).filter(s => s.length);
  if (!segs.length) segs = Array.from(doc.getElementsByTagNameNS('*', 'rte'))
    .map(r => Array.from(r.getElementsByTagNameNS('*', 'rtept')).map(pt).filter(ok)).filter(s => s.length);
  const wpts = Array.from(doc.getElementsByTagNameNS('*', 'wpt')).map(w => {
    const p = pt(w); const n = w.getElementsByTagNameNS('*', 'name')[0];
    p.name = n ? n.textContent : ''; return p;
  }).filter(ok);
  if (!segs.length && !wpts.length) throw new Error('empty');
  let dist = 0, t0 = NaN, t1 = NaN;
  segs.forEach(s => s.forEach((p, i) => {
    if (i) dist += haversine(s[i - 1], p);
    if (isFinite(p.time)) { if (!isFinite(t0) || p.time < t0) t0 = p.time; if (!isFinite(t1) || p.time > t1) t1 = p.time; }
  }));
  return { segs: segs.map(s => s.map(p => [p.lat, p.lng])), wpts, dist, t0, t1 };
}
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDuration(ms) {
  const m = Math.round(ms / 60000), h = Math.floor(m / 60);
  return h ? `${h}h ${pad(m % 60)}m` : `${m} min`;
}
function fmtClock(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function routeSub(g) {
  if (!g) return '';
  const bits = [t('km', (g.dist / 1000).toFixed(1))];
  if (isFinite(g.t0)) bits.unshift(fmtDay(dkey(new Date(g.t0))) + ' · ' + fmtClock(g.t0) + '–' + fmtClock(g.t1));
  if (isFinite(g.t0) && g.t1 > g.t0) bits.push(fmtDuration(g.t1 - g.t0));
  return bits.join(' · ');
}

/* Rendering */
function renderMap(trip) {
  const routes = gpxFiles(trip).map(f => {
    const g = mapState.gpx[f.id];
    const off = mapState.hidden.has(String(f.id));
    const sub = g ? routeSub(g) : mapState.failed[f.id] ? t('gpxFail') : t('gpxLoading');
    return `
      <div class="route-row ${off ? 'off' : ''}">
        <span class="rr-swatch" style="background:${routeColour(trip, f.id)}" onclick="toggleRoute('${esc(f.id)}')"></span>
        <span class="rr-main" onclick="focusRoute('${esc(f.id)}')">
          <div class="rr-name">${esc(String(f.name || '').replace(/\.gpx$/i, ''))}</div>
          <div class="rr-sub">${esc(sub)}</div>
        </span>
        <button class="small-btn warn" onclick="deleteRoute('${esc(f.id)}', this)">✕</button>
      </div>`;
  }).join('');
  const cis = tripCheckins(trip);
  let lastDay = '';
  const ciRows = cis.map((c, i) => {
    const d = c.at ? new Date(c.at) : null;
    const day = d && !isNaN(d) ? dkey(d) : '';
    const head = day && day !== lastDay ? `<div class="type-hint" style="margin:12px 0 0">${esc(fmtDay(day, true))}</div>` : '';
    lastDay = day || lastDay;
    return `${head}
      <div class="ci-row">
        <span class="ci-num">${i + 1}</span>

let leafletPromise = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletPromise) return leafletPromise;
  leafletPromise = new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.crossOrigin = 'anonymous';
    css.href = `https://unpkg.com/leaflet@${LEAFLET_VER}/dist/leaflet.css`;
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.crossOrigin = 'anonymous';
    s.src = `https://unpkg.com/leaflet@${LEAFLET_VER}/dist/leaflet.js`;
    s.onload = () => resolve();
    s.onerror = () => { leafletPromise = null; s.remove(); reject(new Error('leaflet')); };
    document.head.appendChild(s);
  });
  return leafletPromise;
}

async function mountMap(trip) {
  try { await loadLeaflet(); }
  catch {
    const s = document.getElementById('map-slot');
    if (s && !s.querySelector('.map-msg')) s.insertAdjacentHTML('beforeend', `<div class="map-msg">${esc(t('mapNeedNet'))}</div>`);
    return;
  }
  const slot = document.getElementById('map-slot');
  if (!slot) return;
  if (!mapState.el) { mapState.el = document.createElement('div'); mapState.el.className = 'map-inner'; }
  slot.insertBefore(mapState.el, slot.firstChild);
  if (!mapState.map) {
    mapState.map = L.map(mapState.el, { zoomControl: true, attributionControl: true }).setView([51.0, 1.5], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd', crossOrigin: true,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(mapState.map);
    mapState.layers = L.layerGroup().addTo(mapState.map);
  }
  mapState.map.invalidateSize();
  const fresh = mapState.tripId !== String(trip.id);
  if (fresh) { mapState.tripId = String(trip.id); mapState.sig = ''; mapState.picking = false; }
  drawMapData(trip, fresh);
  loadRoutes(trip);
}

function drawMapData(trip, fit) {
  if (!mapState.map) return;
  const files = gpxFiles(trip);
  const cis = tripCheckins(trip);
  const sig = JSON.stringify([files.map(f => [f.id, !!mapState.gpx[f.id], mapState.hidden.has(String(f.id))]), cis.map(c => [c.id, c.lat, c.lng, c.note, c.at]), state.lang]);
  if (sig === mapState.sig && !fit) return;
  mapState.sig = sig;
  const g = mapState.layers;
  g.clearLayers();
  const bounds = [];
  files.forEach(f => {
    const r = mapState.gpx[f.id];
    if (!r || mapState.hidden.has(String(f.id))) return;
    const col = routeColour(trip, f.id);
    const label = esc(String(f.name || '').replace(/\.gpx$/i, '')) + '<br><small>' + esc(routeSub(r)) + '</small>';
    r.segs.forEach(seg => {
      L.polyline(seg, { color: col, weight: 4, opacity: 0.9 }).bindPopup(label).addTo(g);
      seg.forEach(p => bounds.push(p));
    });
    const first = r.segs[0] && r.segs[0][0];
    const lastSeg = r.segs[r.segs.length - 1];
    const last = lastSeg && lastSeg[lastSeg.length - 1];
    if (first) L.circleMarker(first, { radius: 6, color: 'white', weight: 2, fillColor: col, fillOpacity: 1 }).bindPopup(label).addTo(g);
    if (last) L.circleMarker(last, { radius: 6, color: col, weight: 3, fillColor: 'white', fillOpacity: 1 }).bindPopup(label).addTo(g);
    r.wpts.forEach(w => { L.circleMarker([w.lat, w.lng], { radius: 4, color: col, weight: 2, fillColor: 'white', fillOpacity: 1 }).bindPopup(esc(w.name || '')).addTo(g); bounds.push([w.lat, w.lng]); });
  });
  cis.forEach((c, i) => {
    const icon = L.divIcon({ className: 'ci-pin', html: `<span><b>${i + 1}</b></span>`, iconSize: [24, 24], iconAnchor: [3, 27], popupAnchor: [9, -24] });
    const d = c.at ? new Date(c.at) : null;
    const when = d && !isNaN(d) ? fmtDay(dkey(d)) + ' · ' + fmtClock(d) : '';
    L.marker([c.lat, c.lng], { icon }).bindPopup(`<b>${esc(c.note || '📍')}</b><br><small>${esc(when)}</small>`).addTo(g);
    bounds.push([c.lat, c.lng]);
  });
  if (fit && bounds.length) mapState.map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
}

async function loadRoutes(trip) {
  const todo = gpxFiles(trip).filter(f => !mapState.gpx[f.id] && !mapState.loading[f.id] && !mapState.failed[f.id]);
  if (!todo.length) return;
  const hadAny = Object.keys(mapState.gpx).some(id => gpxFiles(trip).some(f => String(f.id) === id));
  await Promise.all(todo.map(async f => {
    mapState.loading[f.id] = true;
    try {
      let rec = await idbGet(f.id);
      if (!rec) rec = await fetchFileRec(f.id);
      mapState.gpx[f.id] = parseGpx(await rec.blob.text());
    } catch (e) { mapState.failed[f.id] = true; }
    finally { delete mapState.loading[f.id]; }
  }));
  if (state.route.tab === 'map' && String(state.route.tripId) === String(trip.id)) {
    rerender();
    drawMapData(trip, !hadAny && tripCheckins(trip).length === 0);
  }
}

function toggleRoute(id) {
  id = String(id);
  if (mapState.hidden.has(id)) mapState.hidden.delete(id); else mapState.hidden.add(id);
  render();
}
function focusRoute(id) {
  const r = mapState.gpx[id];
  if (!r || !mapState.map) return;
  if (mapState.hidden.has(String(id))) { mapState.hidden.delete(String(id)); render(); }
  const pts = [].concat(...r.segs, r.wpts.map(w => [w.lat, w.lng]));
  if (pts.length) mapState.map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
  document.getElementById('map-slot').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function focusCheckin(id) {
  const trip = tripById(state.route.tripId);
  const c = trip && tripCheckins(trip).find(x => String(x.id) === String(id));
  if (!c || !mapState.map) return;
  mapState.map.setView([c.lat, c.lng], Math.max(mapState.map.getZoom(), 16));
  mapState.layers.eachLayer(l => { if (l.getLatLng && !l.getRadius && l.getLatLng().lat === c.lat && l.getLatLng().lng === c.lng) l.openPopup(); });
  document.getElementById('map-slot').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* GPX upload */
let gpxTripId = null;
function pickGpx(tripId) {
  if (!getSyncUrl() || !navigator.onLine) { toast(t('onlineOnly')); return; }
  gpxTripId = tripId;
  const input = document.getElementById('gpx-input');
  if (input) { input.value = ''; input.click(); }
}
async function onGpxPicked(input) {
  const file = input.files && input.files[0];
  if (!file || !gpxTripId) return;
  if (file.size > 10 * 1024 * 1024) { toast(t('fileTooBig')); return; }
  const tripId = gpxTripId;
  let text, parsed;
  try { text = await file.text(); parsed = parseGpx(text); }
  catch { toast(t('notGpx')); return; }
  const id = uid();
  const mime = 'application/gpx+xml';
  const name = /\.gpx$/i.test(file.name) ? file.name : (file.name || 'route') + '.gpx';
  const base64 = btoa(unescape(encodeURIComponent(text)));
  setSavingOverlay(true, t('uploading'));
  try {
    const data = await postRaw({ action: 'upload', item: { id, parent_id: GPX_PARENT, trip_id: tripId, name, mime }, data: base64 });
    applyServerData(data);
    const blob = new Blob([text], { type: mime });
    await idbPut(id, { name, mime, blob });
    mapState.gpx[id] = parsed;
    toast(t('routeSaved'));
  } catch (e) {
    toast(t('saveFail'));
  } finally {
    setSavingOverlay(false);
    render();
    if (mapState.gpx[id]) focusRoute(id);
  }
}
async function deleteRoute(id, btn) {
  if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = t('delConfirm'); return; }
  await send([{ action: 'delete', kind: 'files', id }]);
  await idbDel(id);
  delete mapState.gpx[id];
  toast(t('fileDeleted'));
  render();
}

function isTicketFile(f) { return /^image\//.test(f.mime || '') || /pdf/i.test(f.mime || '') || /\.(pdf|png|jpe?g|heic|webp)$/i.test(f.name || ''); }
function walletFiles(trip) {

  itemsSorted(tripItems(trip)).forEach(e => filesFor(e.id).filter(isTicketFile).forEach(f => out.push({ file: f, ev: e })));
  filesFor(trip.id).filter(isTicketFile).forEach(f => out.push({ file: f, ev: null }));

}
async function getFileRec(id) {

}
async function cacheAllTickets(tripId) {

function openWallet(tripId) {

function walletView(m) {

async function fillWalletSlide(f) {
  const box = () => document.getElementById('wbody-' + f.id);
  let rec;
  try { rec = await getFileRec(f.id); }
  catch { const b = box(); if (b) b.innerHTML = `<div class="wload">${esc(t('fileFail'))}</div>`; return; }
  const b = box();
  if (!b || !state.modal || state.modal.type !== 'wallet') return;
  const mime = rec.mime || f.mime || '';
  const url = URL.createObjectURL(rec.blob);
  (state.modal.urls = state.modal.urls || []).push(url);
  if (/^image\//.test(mime)) { b.innerHTML = `<img alt="" src="${url}">`; return; }
  if (/pdf/i.test(mime) || /\.pdf$/i.test(f.name || '')) {
    try { await renderPdfInto(b, rec.blob); }
    catch { b.innerHTML = `<iframe src="${url}"></iframe>`; }
    return;
  }
  b.innerHTML = `<a class="btn secondary" href="${url}" target="_blank">${esc(t('open'))}</a>`;

let pdfjsPromise = null;
const PDFJS_VER = '3.11.174';
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.crossOrigin = 'anonymous';
    sc.src = `https://unpkg.com/pdfjs-dist@${PDFJS_VER}/legacy/build/pdf.min.js`;
    sc.onload = () => {
      const lib = window.pdfjsLib;
      if (!lib) { pdfjsPromise = null; reject(new Error('pdfjs')); return; }
      lib.GlobalWorkerOptions.workerSrc = `https://unpkg.com/pdfjs-dist@${PDFJS_VER}/legacy/build/pdf.worker.min.js`;
      resolve(lib);
    };
    sc.onerror = () => { pdfjsPromise = null; sc.remove(); reject(new Error('pdfjs')); };
    document.head.appendChild(sc);
  });
  return pdfjsPromise;
}
// Draw every PDF page as a sharp image, so QR codes on page 2+ (e.g. second passenger) show too
async function renderPdfInto(box, blob) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: await blob.arrayBuffer() }).promise;
  box.innerHTML = '';
  const width = Math.max(320, box.clientWidth || 360);
  const dpr = Math.min(3, window.devicePixelRatio || 2);
  for (let i = 1; i <= pdf.numPages && i <= 20; i++) {
    const page = await pdf.getPage(i);
    const v1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: (width / v1.width) * dpr });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    if (!document.body.contains(box)) return;
    box.appendChild(c);
  }
}

function timeInput(id, v) {
  return `<input type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" id="${id}" value="${esc(hhmm(v))}" oninput="onTimeType(this)" onblur="onTimeBlur(this)">`;
}
function onTimeType(el) {
  const digits = el.value.replace(/\D/g, '').slice(0, 4);
  let out = digits;
  if (digits.length === 3) out = digits[0] + ':' + digits.slice(1);
  else if (digits.length === 4) out = digits.slice(0, 2) + ':' + digits.slice(2);
  if (out !== el.value) el.value = out;
}
function onTimeBlur(el) {
  const v = el.value.trim();
  if (!v) return;
  const m = v.match(/^(\d{1,2}):?(\d{2})?$/);
  if (!m) { el.value = ''; return; }
  const h = Number(m[1]), mi = Number(m[2] || 0);
  el.value = (h > 23 || mi > 59) ? '' : pad(h) + ':' + pad(mi);
}
async function saveItem() {
  if (state.saving) return;
  const m = state.modal;
  const trip = tripById(state.route.tripId);
  const type = m.itemType;
  const e = m.ev || {};
  const date = val('it-date');
  if (!date) { toast(t('needDates')); return; }
  const syncOn = document.getElementById('it-sync').checked;
  const base = {
    ...e,
    id: m.id || uid(),
    assignee: m.id ? e.assignee : (list(trip && trip.travellers).length ? list(trip.travellers) : DEFAULT_TRAVELLERS).join(','),
    recurring: 'none', recur_until: '', exceptions: e.exceptions || '',
    booking_ref: val('it-ref'),
    sync_to_ios: syncOn,
    recipients: syncOn ? picked('it-recips').join(',') : '',
    alarm_minutes: syncOn ? serialiseAlarms(picked('it-alarms')) : ''
  };
  let item;
  if (type === 'transport') {
    const from = val('it-from'), to = val('it-to');
    const title = val('it-title') || [from, to].filter(Boolean).join(' to ');
    if (!title) { toast(t('needTitle')); return; }
    item = { ...base, kind: 'travel', title, travel_method: picked('it-method')[0] || 'other',
             from_location: from, to_location: to, date, time: val('it-time'),
             end_date: val('it-end-date') || date, end_time: val('it-end-time'),
             from_tz: val('it-from-tz'), to_tz: val('it-to-tz'), notes: val('it-notes') };
  } else if (type === 'stay') {
    const name = val('it-title');
    if (!name) { toast(t('needTitle')); return; }
    const checkout = val('it-checkout') || addDays(date, 1);
    if (checkout <= date) { toast(t('endBeforeStart')); return; }
    const last = addDays(checkout, -1);
    item = { ...base, kind: 'stay', title: 'Hotel: ' + name.replace(/^hotel:\s*/i, ''), date, time: '', end_time: '',
             end_date: last > date ? last : '', travel_method: '', from_location: '', to_location: '', from_tz: '', to_tz: '',
             notes: joinNotes(val('it-loc'), val('it-notes')) };
  } else {
    const title = val('it-title');
    if (!title) { toast(t('needTitle')); return; }
    item = { ...base, kind: 'activity', title, date, time: val('it-time'), end_time: val('it-end-time'), end_date: '',
             travel_method: '', from_location: '', to_location: '', from_tz: '', to_tz: '',
             notes: joinNotes(val('it-loc'), val('it-notes')) };
  }
  await saving(async () => {
    await send([{ action: m.id ? 'update' : 'add', kind: 'events', item }]);
    state.modal = null;
    toast(t('saved'));
    render();
  });
}
async function deleteItem() {

    .concat(filesFor(m.id).map(f => ({ action: 'delete', kind: 'files', id: f.id })));
  await saving(async () => {
    await send(changes);
    state.modal = null;
    toast(t('deleted'));
    render();
  });
}
